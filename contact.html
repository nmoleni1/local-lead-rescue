<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Service - Apex Plumbing & LeadRescue AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-lg w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="inline-flex p-3 rounded-2xl bg-blue-500/10 text-blue-400 mb-1">
                <i class="fa-solid fa-wrench text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">Emergency Home Service Dispatch</h1>
            <p class="text-xs text-slate-400">Serving Salt Lake City & West Valley City, UT &bull; 24/7 Fast Response</p>
        </div>

        <form action="/api/webhook/lead" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Your Full Name</label>
                <input type="text" name="name" required placeholder="John Doe" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Mobile Phone Number</label>
                <input type="tel" name="phone" required placeholder="(801) 555-0199" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Service Needed</label>
                <select name="service" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm focus:outline-none focus:border-blue-500">
                    <option value="Plumbing Service">Plumbing (Water Leak / Water Heater)</option>
                    <option value="HVAC Service">HVAC (Heating / AC Repair)</option>
                    <option value="Electrical Service">Electrical Emergency</option>
                    <option value="Roofing Service">Roofing / Leak Inspection</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Notes / Problem Description</label>
                <textarea name="notes" rows="2" placeholder="Briefly describe your emergency..." class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm focus:outline-none focus:border-blue-500"></textarea>
            </div>

            <!-- Mandatory Carrier A2P 10DLC Compliance Opt-in Checkbox -->
            <div class="pt-2 border-t border-slate-800 space-y-2">
                <label class="flex items-start gap-2.5 cursor-pointer">
                    <input type="checkbox" required checked class="mt-1 rounded border-slate-700 bg-slate-950 text-blue-600 focus:ring-0">
                    <span class="text-[11px] text-slate-300 leading-tight">
                        I agree to receive service appointment updates, technician arrival notifications, and customer care text messages from LeadRescue AI at the mobile number provided above. Consent is not a condition of purchase. Msg & data rates may apply. Msg frequency varies. Reply <strong>STOP</strong> to unsubscribe, reply <strong>HELP</strong> for help. View our <a href="/privacy.html" class="text-blue-400 underline" target="_blank">Privacy Policy</a> and <a href="/terms.html" class="text-blue-400 underline" target="_blank">Terms of Service</a>.
                    </span>
                </label>
            </div>

            <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl text-sm transition shadow-lg shadow-blue-600/30">
                Request Technician Dispatch
            </button>
        </form>

        <p class="text-center text-xs text-slate-500">
            Immediate emergency? Call our dispatch line directly at <strong class="text-slate-300">(385) 270-8257</strong>.
        </p>
    </div>
</body>
</html>
